<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Charging Station</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f8;
            margin: 0;
        }

        .container {
            width: 40%;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1abc9c;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
        }

        button:hover {
            background: #16a085;
        }

        .nav {
            text-align: center;
            margin-top: 15px;
        }

        a {
            text-decoration: none;
            color: #1abc9c;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Add Charging Station</h2>

    <form th:action="@{/save}" th:object="${station}" method="post">

    Station Name:<br>
    <input type="text" th:field="*{name}" required><br><br>

    Location:<br>
    <input type="text" th:field="*{location}" required><br><br>

    Charger Power (kW):<br>
    <input type="number" th:field="*{power}" required><br><br>

    Cost per kWh (₹):<br>
    <input type="number" step="0.01" th:field="*{costPerKwh}" required><br><br>

    <button type="submit">Save Station</button>
</form>


    <div class="nav">
        <a href="/">Home</a>
    </div>
</div>

</body>
</html>
