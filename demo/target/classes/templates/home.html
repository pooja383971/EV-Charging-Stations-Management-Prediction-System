<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home - EV Charging</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;

            background-image: url('/images/ev-bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.6);
            height: 100vh;
            color: white;
            text-align: center;
            padding-top: 150px;
        }

        h1 {
            font-size: 48px;
        }

        p {
            font-size: 20px;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #00b894;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            background-color: #019874;
        }
    </style>
</head>

<body>

<div class="overlay">
    <h1>Welcome to EV Charging System ⚡</h1>
    <p>Find stations • Add stations • Predict charging time</p>

    <a href="/stations" class="btn">View Stations</a>
    <a href="/prediction" class="btn">Charging Prediction</a>
</div>

</body>
</html>
