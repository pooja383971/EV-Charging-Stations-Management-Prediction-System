<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Station</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="navbar">
    <a href="/">Home</a>
    <a href="/stations">Stations</a>
    <a href="/prediction">Prediction</a>
</div>

<div class="container">
    <h2>Add Charging Station</h2>

    <form action="/save" method="post" th:object="${station}">
        <input type="text" th:field="*{name}" placeholder="Station Name" required />
        <input type="text" th:field="*{location}" placeholder="Location (City, Area)" required />
        <input type="number" th:field="*{power}" placeholder="Power (kW)" required />
        <button type="submit">💾 Save Station</button>
    </form>
</div>

</body>
</html>
